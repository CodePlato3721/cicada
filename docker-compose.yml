services:
  redis:
    image: redis:7
    container_name: cicada-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cicada_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    # 换成带 TimescaleDB 的镜像（普通 postgres:17 装不了 timescaledb 扩展，见
    # db/migrations/V3__enable_timescaledb.sql）。换镜像不是原地升级，已有本地
    # volume 里的数据要先导出再导入，步骤见 README「本地 Postgres」一节。
    image: timescale/timescaledb:latest-pg17
    container_name: cicada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cicada
      POSTGRES_USER: cicada
      POSTGRES_PASSWORD: cicada_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cicada_postgres_data:/var/lib/postgresql/data

volumes:
  cicada_redis_data:
  cicada_postgres_data: